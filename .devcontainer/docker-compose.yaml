services:
  backend:
    image: mcr.microsoft.com/devcontainers/python:3.12-trixie
    volumes:
      - ../:/workspaces/myproject:cached
    command: sleep infinity
    # command: sh -c "cd /workspaces/myproject/backend && uv run fastapi dev src/app/main.py --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  frontend:
    image: mcr.microsoft.com/devcontainers/typescript-node:20
    volumes:
      - ../:/workspaces/myproject:cached
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
