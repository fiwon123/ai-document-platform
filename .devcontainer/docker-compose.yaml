services:
  backend:
    image: mcr.microsoft.com/devcontainers/python:3.12-trixie
    working_dir: /workspaces/myproject/backend
    volumes:
      - ../:/workspaces/myproject:cached
    command: sleep infinity
    ports:
      - "8000:8000"

  frontend:
    image: mcr.microsoft.com/devcontainers/typescript-node:20
    working_dir: /workspaces/myproject/frontend
    volumes:
      - ../:/workspaces/myproject:cached
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
