name: CI

on:
  pull_request:
    types: [labeled, synchronize]
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# dorny/paths-filter reads the PR change list via the GitHub API.
permissions:
  contents: read
  pull-requests: read

# CI is intentionally label-gated to conserve Actions minutes during
# development. Jobs run only when:
#   * a pull request carries (or just received) the `ci` label, or
#   * the workflow is manually dispatched from the Actions tab.
# The focal CI gate lets us do all heavy verification at milestone time.
jobs:
  backend-check:
    name: Backend (uv sync + syntax check)
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'ci') && (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync dependencies (locked)
        run: uv sync --locked
        working-directory: backend

      - name: Syntax check
        run: uv run python -m compileall -q src
        working-directory: backend

  backend-test:
    name: Backend (pytest)
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'ci') && (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Skip the expensive pytest job body entirely for PRs that touch no
      # backend code (frontend-only work is validated by the frontend jobs).
      - name: Detect backend changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'

      - name: Install uv
        if: steps.changes.outputs.backend == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.changes.outputs.backend == 'true'
        run: uv python install 3.14

      - name: Sync dependencies (locked)
        if: steps.changes.outputs.backend == 'true'
        run: uv sync --locked
        working-directory: backend

      - name: Run tests
        if: steps.changes.outputs.backend == 'true'
        # Exit code 5 means pytest collected no tests (e.g. main without
        # the test suite yet) — treat that as a pass, not a failure.
        run: uv run pytest -q || test $? -eq 5
        working-directory: backend

  frontend-lint:
    name: Frontend (oxlint)
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'ci') && (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run lint
        run: npm run lint
        working-directory: frontend

  frontend-build:
    name: Frontend (typecheck + build)
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'ci') && (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck and build
        run: npm run build
        working-directory: frontend