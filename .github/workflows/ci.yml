name: CI

on:
  pull_request:
    types: [labeled, synchronize]
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# dorny/paths-filter reads the PR change list via the GitHub API.
permissions:
  contents: read
  pull-requests: read

# CI is intentionally label-gated to conserve Actions minutes during
# development. Jobs run only when:
#   * a pull request carries (or just received) the `ci` label, or
#   * the workflow is manually dispatched from the Actions tab.
# The focal CI gate lets us do all heavy verification at milestone time.
jobs:
  backend-check:
    name: Backend (uv sync + ruff + syntax)
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'ci') && (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Skip the expensive job body entirely for PRs that touch no backend
      # code (frontend-only work is validated by the frontend jobs).
      - name: Detect backend changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'

      - name: Install uv
        if: steps.changes.outputs.backend == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.changes.outputs.backend == 'true'
        run: uv python install 3.14

      - name: Sync dependencies (locked)
        if: steps.changes.outputs.backend == 'true'
        run: uv sync --locked
        working-directory: backend

      - name: Syntax check
        if: steps.changes.outputs.backend == 'true'
        run: uv run python -m compileall -q src
        working-directory: backend

      - name: Lint (ruff)
        if: steps.changes.outputs.backend == 'true'
        run: uv run ruff check src/
        working-directory: backend

  backend-test:
    name: Backend (pytest)
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'ci') && (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    runs-on: ubuntu-latest
    # Without Redis this suite **fails**, which is the reason for the service
    # below. It does not hang: measured with the object store absent, the three
    # Redis-dependent files take 4.0s with a reachable server and 4.2s with
    # `REDIS_PORT=1`, so Redis costs no measurable time.
    #
    # The ~30 minutes this job was actually taking was #634 — the S3 client
    # retrying an absent object store on every app construction. With that
    # merged the whole suite runs in ~4m20s, so this ceiling has real room; it
    # is here to turn a job that hangs into one that reports red.
    # See #630.
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The suite needs Redis, not just postgres: tests/test_cache.py,
      # tests/test_rate_limit.py, tests/test_provider_quota.py, the QA
      # provider-budget tests and the document-status cache test all assert
      # against it. Same image as the dev sandbox. `conftest.py` forces
      # REDIS_DB=15, so the job cannot touch anything else on the runner.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Skip the expensive pytest job body entirely for PRs that touch no
      # backend code (frontend-only work is validated by the frontend jobs).
      - name: Detect backend changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'

      - name: Install uv
        if: steps.changes.outputs.backend == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.changes.outputs.backend == 'true'
        run: uv python install 3.14

      - name: Sync dependencies (locked)
        if: steps.changes.outputs.backend == 'true'
        run: uv sync --locked
        working-directory: backend

      - name: Run tests
        if: steps.changes.outputs.backend == 'true'
        # Exit code 5 means pytest collected no tests (e.g. main without
        # the test suite yet) — treat that as a pass, not a failure.
        run: uv run pytest -q || test $? -eq 5
        working-directory: backend

  frontend-lint:
    name: Frontend (oxlint + format)
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'ci') && (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run lint
        run: npm run lint
        working-directory: frontend

      - name: Run format check
        run: npm run format:check
        working-directory: frontend

  frontend-build:
    name: Frontend (typecheck + build)
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'ci') && (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck and build
        run: npm run build
        working-directory: frontend

  frontend-test:
    name: Frontend (vitest)
    if: github.event_name == 'workflow_dispatch' || (contains(github.event.pull_request.labels.*.name, 'ci') && (github.event.action != 'labeled' || github.event.label.name == 'ci'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests
        run: npm test
        working-directory: frontend