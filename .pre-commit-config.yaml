# Pre-commit hooks — install with:
#   pip install pre-commit && pre-commit install
# (or `uvx pre-commit install` if you prefer managing it via uv)
#
# Hooks mirror the local gates that `make check` enforces (see
# DEVELOPMENT.md): ruff lint for backend Python, oxlint for frontend
# TS/TSX. `make check` remains the authoritative gate — these hooks are a
# fast local convenience, not a separate standard.

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: bash -c 'cd backend && uv run ruff check src/'
        language: system
        files: ^backend/src/
        types: [python]

      - id: oxlint
        name: oxlint (frontend)
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/src/
        types: [ts, tsx, js, jsx]

      - id: shell-syntax
        name: shell syntax (bash -n)
        entry: bash -c 'for f in "$@"; do bash -n "$f"; done'
        language: system
        files: \.(sh|bash)$
        types: [shell]