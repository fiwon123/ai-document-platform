[alembic]
script_location = migrations
prepend_sys_path = .
# Fallback URL (overridden by env.py when DATABASE_URL is set).
# Host port 5434 matches the docker-compose PostgreSQL mapping.
sqlalchemy.url = postgresql://postgres:mysecretpassword@localhost:5434/mydb

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
