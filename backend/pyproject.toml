[project]
name = "backend"
version = "0.1.0"
description = "AI Document Intelligence Platform Backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14.0",
    "boto3>=1.43.68",
    "fastapi[standard]>=0.140.13",
    # Pinned: passlib 1.7.4 is incompatible with bcrypt>=4.1 (removed bcrypt.__about__)
    "bcrypt==4.0.1",
    "passlib>=1.7.4",
    "pgvector>=0.3.6",
    "psycopg2-binary>=2.9.12",
    # pypdf is the maintained continuation of PyPDF2 (the project was
    # renamed; PyPDF2 3.0.1 was the last release under that name).
    "pypdf>=4.0.0",
    "python-jose[cryptography]>=3.5.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.51",
    "openai>=1.0.0",
    "arq>=0.28.0",
    "pymupdf>=1.28.2",
    "prometheus-client>=0.20.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# assert statements and fixture credentials are expected in tests
"tests/**/*.py" = ["S101", "S105"]

[build-system]
requires = ["uv_build>=0.9.2"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
namespace = false
