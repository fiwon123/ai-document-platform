[project]
name = "backend"
version = "0.1.0"
description = "AI Document Intelligence Platform Backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "boto3>=1.43.92",
    "fastapi[standard]>=0.141.1",
    # Pinned: passlib 1.7.4 is incompatible with bcrypt>=4.1 (removed bcrypt.__about__)
    "bcrypt==4.0.1",
    "passlib>=1.7.4",
    "pgvector>=0.5.0",
    # psycopg3 (import `psycopg`) is the driver SQLAlchemy 2.1+ uses by
    # default for driverless `postgresql://` URLs, which is how this app and
    # its tests build them (database/db.py, tests/conftest.py). The old
    # psycopg2-binary dependency was dropped when the stack moved to it (#697).
    "psycopg[binary]>=3.2.0",
    # pypdf is the maintained continuation of PyPDF2 (the project was
    # renamed; PyPDF2 3.0.1 was the last release under that name).
    "pypdf>=4.0.0",
    "python-jose[cryptography]>=3.5.0",
    "redis>=5.0.0",
    # psycopg3 is the default driver for driverless postgresql:// URLs since
    # 2.1 — see the psycopg[binary] entry above (#697).
    "sqlalchemy>=2.1",
    "openai>=3.13.0",
    "arq>=0.28.0",
    "pymupdf>=1.28.2",
    "prometheus-client>=0.20.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    # Parses docker-compose.yaml in tests/test_compose_env.py, which pins the
    # sandbox's provider variables to the app's own defaults. Already resolved
    # transitively via alembic; declared here so the test does not rely on
    # another package's dependency graph.
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# assert statements and fixture credentials are expected in tests
"tests/**/*.py" = ["S101", "S105"]

[build-system]
requires = ["uv_build>=0.12.22"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
namespace = false
