[project]
name = "backend"
version = "0.1.0"
description = "AI Document Intelligence Platform Backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14.0",
    "boto3>=1.43.68",
    "fastapi[standard]>=0.140.13",
    # Pinned: passlib 1.7.4 is incompatible with bcrypt>=4.1 (removed bcrypt.__about__)
    "bcrypt==4.0.1",
    "passlib>=1.7.4",
    "pgvector>=0.3.6",
    "psycopg2-binary>=2.9.12",
    "PyPDF2>=3.0.0",
    "python-jose[cryptography]>=3.5.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "openai>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.9.2"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
namespace = false
