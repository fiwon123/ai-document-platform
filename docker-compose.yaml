services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      # Host port 5434 avoids conflicts with other local PostgreSQL instances /
      # Docker projects binding 5432. Internal container port stays 5432.
      - "5434:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          # Cap each service so a single container can never exhaust the host
          # memory and trigger the OOM killer (exit code 137) during startup.
          memory: 512M
    networks:
      - default

  redis:
    image: redis:7-alpine
    ports:
      # Host port 63790 avoids conflicts with other local Redis instances /
      # Docker projects binding 6379. Internal container port stays 6379.
      - "63790:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - default

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - default

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # Host port 8001 avoids conflicts with other local projects' containers
      # binding 8000. Internal container port stays 8000.
      - "8001:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-mysecretpassword}@postgres:5432/${POSTGRES_DB:-mydb}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/workspace
      # Persist gh CLI credentials so they survive container rebuilds.
      # Mounted at both homes: the agent shell runs as root, while the
      # interactive devcontainer terminal typically runs as vscode.
      - gh_cli_config:/root/.config/gh
      - gh_cli_config:/home/vscode/.config/gh
      # Persist the Python venv and uv download cache so `uv sync` on every
      # container start is a fast no-op instead of a full dependency install
      # (the main contributor to the startup memory spike / OOM kill).
      - backend_venv:/workspace/backend/.venv
      - uv_cache:/root/.cache/uv
    working_dir: /workspace/backend
    command: >
      sh -c "uv sync --frozen && { count=0; until uv run python -c \"import socket; socket.getaddrinfo('postgres', 5432)\" >/dev/null 2>&1 || [ $$count -ge 45 ]; do echo 'waiting for postgres...'; sleep 2; count=$$((count+1)); done; } && uv run python -m alembic upgrade head && exec uv run python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      # python:3.14-slim ships no curl; urllib is stdlib and always present.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      # uv sync + alembic + uvicorn on a cold start can take a while;
      # failures during start_period do not count against retries.
      start_period: 90s
    deploy:
      resources:
        limits:
          # Hosts the VS Code server, devcontainer features (node, uv, gh),
          # uv sync, alembic and uvicorn — give it the most headroom.
          memory: 3G
    networks:
      - default

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-mysecretpassword}@postgres:5432/${POSTGRES_DB:-mydb}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Wait for backend to finish `uv sync` + migration + startup first.
      # The worker's `uv sync` then reuses the already-populated venv instead
      # of triggering a second full dependency install at the same time as
      # backend/frontend (avoids the startup memory spike).
      backend:
        condition: service_healthy
    volumes:
      - .:/workspace
      # Share the same venv and uv cache as the backend container: same image,
      # same lockfile, so dependencies are installed exactly once.
      - backend_venv:/workspace/backend/.venv
      - uv_cache:/root/.cache/uv
    working_dir: /workspace/backend
    command: >
      sh -c "uv sync --frozen && { count=0; until uv run python -c \"import socket; socket.getaddrinfo('postgres', 5432)\" >/dev/null 2>&1 || [ $$count -ge 45 ]; do echo 'waiting for postgres...'; sleep 2; count=$$((count+1)); done; } && exec uv run arq app.worker.WorkerSettings"
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - default

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Host port 5175 avoids conflicts with other local projects' containers
      # binding 5173. Internal container port stays 5173.
      - "5175:5173"
    environment:
      # Inside this container the backend is only reachable by compose
      # service name, not localhost, so point the Vite proxy at it.
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      # Only run `npm install` / boot Vite once backend is healthy so installs
      # don't overlap with backend's `uv sync` memory spike.
      backend:
        condition: service_healthy
    volumes:
      - .:/workspace
      # Named volume (instead of anonymous) so node_modules survives rebuilds
      # and `npm install` is fast on subsequent starts.
      - frontend_node_modules:/workspace/frontend/node_modules
      # Persist the npm cache so repeated installs are fast and low-memory.
      - npm_cache:/root/.npm
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - default

networks:
  # Pin the project network by name so host-side `docker compose up` runs and
  # the Dev Containers CLI's `up -d --no-recreate` always target the SAME
  # physical network. Prevents the drift where infrastructure containers end
  # up with no network attachment, which bricks backend DNS resolution for
  # the "postgres" service name.
  default:
    name: ai-document-platform_default

volumes:
  postgres_data:
  redis_data:
  minio_data:
  # Persists gh CLI credentials across devcontainer rebuilds (see backend
  # service mounts). Remove with `docker compose down -v` to clear auth.
  gh_cli_config:
  # Persist the Python venv and uv cache across restarts so the dependency
  # install only happens once (see backend/worker mounts).
  backend_venv:
  uv_cache:
  # Persist node_modules and the npm cache across restarts.
  frontend_node_modules:
  npm_cache: