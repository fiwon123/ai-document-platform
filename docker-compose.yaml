# Dev-sandbox Compose file (repo root) — lightweight Docker-based development.
#
# Replaces the old VS Code Dev Containers setup (`.devcontainer/`): a single
# prebuilt `dev` container (bind-mounted source, deps baked at image build)
# runs uvicorn + vite in the foreground with fast hot reload, a `worker`
# service runs the arq document-processing worker, and `postgres` / `redis` /
# `minio` provide infrastructure. Use `docker compose up dev` (or `make
# dev-up`); use `make infra-up` for the host-native path (infra only, then
# run uvicorn + vite directly on the host).
#
# `name` is pinned so project volumes/networks keep the
# ai-document-platform_* prefix regardless of where the compose file lives.
# The Make targets export host identity and host path variables. Direct
# `docker compose` users should set HOST_UID/HOST_GID/DOCKER_GID and use
# `--build` before starting the services.

name: ai-document-platform

services:
  # Dev sandbox — the coding/runtime environment. Source is bind-mounted for
  # hot reload; backend deps are baked into /opt/backend-venv; node_modules
  # is shared with the host and bootstrapped via npm ci when missing.
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    # Match the host identity so bind-mounted workspace writes do not become
    # root-owned files. The trusted dev service also needs the host Docker
    # socket group to drive Compose from inside the sandbox.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-999}"
    command: ["/sandbox/ai-document-platform/dev-entrypoint.sh"]
    # Docker's default /dev/shm is 64 MB, which makes Chromium crash on any
    # non-trivial page. The baked headless Chromium (see Dockerfile) is what
    # accessibility/E2E checks run against, so give it real shared memory.
    shm_size: "2gb"
    ports:
      # Host ports avoid conflicts with other local projects' containers
      # binding 8000/5173. Internal container ports stay 8000/5173, so the
      # Vite proxy default (http://localhost:8000) inside the container just
      # works.
      - "8001:8000"
      - "5175:5173"
    environment:
      HOME: /home/appuser
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      HOST_HOME: ${HOST_HOME:-${HOME}}
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:-.}
      DOCKER_GID: ${DOCKER_GID:-999}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio:9000
      # Endpoint minted INSIDE presigned download/thumbnail URLs served to the
      # browser. minio:9000 is only resolvable inside the Docker network, so
      # presigned URLs must use the host-published port instead.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-mysecretpassword}@postgres:5432/${POSTGRES_DB:-mydb}
      # GitHub passthrough for the sandboxed AI agent (trusted-agent model):
      # the `dev` service mounts gh config + the Docker socket and drives the
      # GitHub workflow, so it forwards the host token by name only. The
      # `worker` service deliberately does NOT get these (non-trusted).
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ${HOST_PROJECT_DIR:-.}:/sandbox/ai-document-platform:cached
      # Sandboxed AI coding agent (trusted-agent model — see DEVELOPMENT.md):
      # mount the host Docker socket so opencode INSIDE the dev container can
      # drive Docker/compose, and share the host gh auth, opencode binary +
      # config, and git identity read-only. `make dev-up` pre-creates
      # ${HOST_HOME}/.config/opencode and ${HOST_HOME}/.gitconfig so these mounts
      # never fail on a fresh machine. The `worker` service gets none of these.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_HOME:-${HOME}}/.config/gh:/home/appuser/.config/gh:ro
      - ${HOST_HOME:-${HOME}}/.opencode/bin/opencode:/usr/local/bin/opencode:ro
      - ${HOST_HOME:-${HOME}}/.config/opencode:/home/appuser/.config/opencode:ro
      - ${HOST_HOME:-${HOME}}/.gitconfig:/home/appuser/.gitconfig:ro
    healthcheck:
      # python:3.14-slim ships no curl; urllib is stdlib and always present.
      # /v1/health returns 503 when degraded (e.g. no worker heartbeat yet).
      # Treat degraded as container-ready: the worker container is gated on
      # `dev: service_healthy`, and the worker seeds the heartbeat that
      # flips /v1/health back to 200 — failing here would deadlock cold starts.
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request as u, urllib.error as e
          try:
              u.urlopen('http://localhost:8000/v1/health', timeout=5)
          except e.HTTPError as x:
              exit(0 if x.code == 503 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      # Image build deps are baked, so cold starts are fast; keep a generous
      # start_period anyway for alembic + uvicorn on first boot.
      start_period: 90s
    deploy:
      resources:
        limits:
          # Runs uvicorn --reload + vite + alembic — give it headroom, but
          # baking deps into the image removes the old startup memory spike.
          memory: 2G
    networks:
      - default

  # arq worker — consumes document-processing jobs from Redis. A managed
  # Compose service (not a background process) so it restarts automatically
  # if it crashes. The baked /opt/backend-venv is used directly (no uv sync
  # race with the dev container).
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    # The worker also writes Python caches in the bind-mounted workspace, so it
    # must use the same host identity as the dev service.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["/opt/backend-venv/bin/arq", "app.worker.WorkerSettings"]
    working_dir: /sandbox/ai-document-platform/backend
    environment:
      HOME: /home/appuser
      HOST_HOME: ${HOST_HOME:-${HOME}}
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:-.}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio:9000
      # Presigned URL endpoint (browser-reachable) — see dev service above.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-mysecretpassword}@postgres:5432/${POSTGRES_DB:-mydb}
      # Processing-timeout tuning (large PDFs): job_timeout is arq's per-run
      # budget; the recovery floor is clamped to job_timeout × retries inside
      # the worker. Embedding knobs bound per-request latency and batch size.
      WORKER_JOB_TIMEOUT_SECONDS: ${WORKER_JOB_TIMEOUT_SECONDS:-900}
      WORKER_RECOVERY_TIMEOUT_MINUTES: ${WORKER_RECOVERY_TIMEOUT_MINUTES:-30}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-120}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-2048}
    depends_on:
      # Wait for dev to finish migrations + start uvicorn first so the worker
      # never polls the queue before the schema exists.
      dev:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ${HOST_PROJECT_DIR:-.}:/sandbox/ai-document-platform:cached
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - default

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      # Host port 5434 avoids conflicts with other local PostgreSQL instances /
      # Docker projects binding 5432. Internal container port stays 5432.
      - "5434:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mysecretpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          # Cap each service so a single container can never exhaust the host
          # memory and trigger the OOM killer (exit code 137) during startup.
          memory: 512M
    networks:
      - default

  redis:
    image: redis:7-alpine
    ports:
      # Host port 63790 avoids conflicts with other local Redis instances /
      # Docker projects binding 6379. Internal container port stays 6379.
      - "63790:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - default

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - default

networks:
  # Pin the project network by name so host-side `docker compose up` runs
  # always target the SAME physical network (prevents the drift that used to
  # brick DNS for the devcontainer; harmless now that compose is the only
  # driver, but keeps the name stable).
  default:
    name: ai-document-platform_default

volumes:
  postgres_data:
  redis_data:
  minio_data:
