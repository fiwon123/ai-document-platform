apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-platform.fullname" . }}-config
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
data:
  POSTGRES_DB: {{ .Values.config.postgres.db | quote }}
  POSTGRES_USER: {{ .Values.config.postgres.user | quote }}
  POSTGRES_HOST: {{ include "ai-platform.postgresHost" . | quote }}
  POSTGRES_PORT: {{ .Values.config.postgres.port | quote }}
  REDIS_HOST: {{ include "ai-platform.redisHost" . | quote }}
  REDIS_PORT: {{ .Values.config.redis.port | quote }}
  REDIS_DB: {{ .Values.config.redis.db | quote }}
  MINIO_ENDPOINT: {{ include "ai-platform.minioEndpoint" . | quote }}
  MINIO_BUCKET: {{ .Values.config.minio.bucket | quote }}
  MINIO_SECURE: {{ .Values.config.minio.secure | quote }}
  MINIO_REGION: {{ .Values.config.minio.region | quote }}
  ALGORITHM: {{ .Values.config.auth.algorithm | quote }}
  ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.config.auth.accessTokenExpireMinutes | quote }}
  REFRESH_TOKEN_EXPIRE_DAYS: {{ .Values.config.auth.refreshTokenExpireDays | quote }}
  REFRESH_COOKIE_SECURE: {{ .Values.config.auth.refreshCookieSecure | quote }}
  OPENAI_MODEL: {{ .Values.config.ai.openaiModel | quote }}
  EMBEDDING_MODEL: {{ .Values.config.ai.embeddingModel | quote }}
  EMBEDDING_DIMENSIONS: {{ .Values.config.ai.embeddingDimensions | quote }}
  LOCAL_EMBEDDING_MODEL: {{ .Values.config.ai.localEmbedding.model | quote }}
  LOCAL_EMBEDDING_DIMENSIONS: {{ .Values.config.ai.localEmbedding.dimensions | quote }}
  QA_MODEL: {{ .Values.config.ai.qaModel | quote }}
  QA_MAX_TOKENS: {{ .Values.config.ai.maxTokens | quote }}
  # Provider ceilings the app enforces itself (#489), matching Groq's free
  # tier so a call is refused before the provider rejects it. The budget is
  # org-wide (Groq's own granularity), and it fails open: a Redis outage
  # leaves question answering working, just uncapped.
  GROQ_REQUESTS_PER_MINUTE: {{ .Values.config.ai.providerQuota.groqRequestsPerMinute | quote }}
  GROQ_TOKENS_PER_DAY: {{ .Values.config.ai.providerQuota.groqTokensPerDay | quote }}
  PROVIDER_QUOTA_ENABLED: {{ .Values.config.ai.providerQuota.enabled | quote }}
  LOCAL_LLM_ENABLED: {{ ternary "true" "" .Values.config.ai.localLlm.enabled | quote }}
  LOCAL_LLM_BASE_URL: {{ .Values.config.ai.localLlm.baseUrl | quote }}
  LOCAL_LLM_MODEL: {{ .Values.config.ai.localLlm.model | quote }}
  LOG_FORMAT: {{ .Values.config.logging.format | quote }}
  RATE_LIMIT_REQUESTS: {{ .Values.config.rateLimit.requests | quote }}
  RATE_LIMIT_WINDOW: {{ .Values.config.rateLimit.window | quote }}