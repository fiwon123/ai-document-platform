{{- if .Values.logging.enabled }}
{{- $namespace := .Values.logging.namespace }}
#
# Centralized logging: Loki (single-binary, filesystem storage) + Promtail
# DaemonSet (tails /var/log/pods) + a Grafana Loki datasource ConfigMap.
# Promtail requires cluster-wide pod read access (ClusterRole below).
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-platform.fullname" . }}-loki
  namespace: {{ $namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: {{ .Values.logging.retentionPeriod }}
    compactor:
      retention_enabled: true
      working_directory: /loki/compactor
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ai-platform.fullname" . }}-loki
  namespace: {{ $namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "ai-platform.fullname" . }}-loki
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: loki
  template:
    metadata:
      labels:
        {{- include "ai-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: loki
    spec:
      containers:
        - name: loki
          image: {{ .Values.logging.lokiImage }}
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http
              containerPort: 3100
            - name: grpc
              containerPort: 9096
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: {{ include "ai-platform.fullname" . }}-loki
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.logging.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-platform.fullname" . }}-loki
  namespace: {{ $namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ai-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-platform.fullname" . }}-promtail
  namespace: {{ $namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    clients:
      - url: http://{{ include "ai-platform.fullname" . }}-loki:3100/loki/api/v1/push
    positions:
      filename: /run/promtail/positions.yaml
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_container_image]
            target_label: image
          - source_labels: [__meta_kubernetes_pod_uid]
            target_label: uid
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-platform.fullname" . }}-promtail
  namespace: {{ $namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ai-platform.fullname" . }}-promtail
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ai-platform.fullname" . }}-promtail
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ai-platform.fullname" . }}-promtail
subjects:
  - kind: ServiceAccount
    name: {{ include "ai-platform.fullname" . }}-promtail
    namespace: {{ $namespace }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ai-platform.fullname" . }}-promtail
  namespace: {{ $namespace }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ai-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: promtail
  template:
    metadata:
      labels:
        {{- include "ai-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: promtail
    spec:
      serviceAccountName: {{ include "ai-platform.fullname" . }}-promtail
      containers:
        - name: promtail
          image: {{ .Values.logging.promtailImage }}
          args:
            - -config.file=/etc/promtail/promtail.yaml
          ports:
            - name: http-metrics
              containerPort: 9080
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: run
              mountPath: /run/promtail
            - name: varlog
              mountPath: /var/log
              readOnly: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: {{ include "ai-platform.fullname" . }}-promtail
        - name: run
          emptyDir: {}
        - name: varlog
          hostPath:
            path: /var/log
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-platform.fullname" . }}-loki-datasource
  namespace: {{ $namespace }}
  labels:
    grafana_datasource: "1"
    {{- include "ai-platform.labels" . | nindent 4 }}
data:
  loki-datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://{{ include "ai-platform.fullname" . }}-loki:3100
        isDefault: false
        jsonData:
          timeout: 60
          maxLines: 1000
{{- end }}