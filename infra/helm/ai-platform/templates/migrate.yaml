{{- if .Values.migrate.enabled }}
# One-shot Alembic migration Job. backend/worker Deployments gate their
# startup on this Job completing (see their wait-for-migrate initContainers).
# A plain Job (no Helm hooks) so it persists as a completed marker — the
# initContainers tolerate TTL cleanup by treating a missing Job as success.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ai-platform.fullname" . }}-migrate
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "ai-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: {{ include "ai-platform.fullname" . }}
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}/backend:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
{{- end }}