{{- if .Values.migrate.enabled }}
# One-shot Alembic migration Job. backend/worker Deployments gate their
# startup on this Job completing (see their wait-for-migrate initContainers).
# A plain Job (no Helm hooks) so it persists as a completed marker — the
# initContainers tolerate TTL cleanup by treating a missing Job as success.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ai-platform.fullname" . }}-migrate
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "ai-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: {{ include "ai-platform.serviceAccountName" . }}
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # The one workload that must reach Postgres, and the only one with no gate
      # on it: `alembic upgrade head` connects on first instruction, so on a fresh
      # install it raced the Postgres StatefulSet through its image pull and PVC
      # init. `backoffLimit` was then exhausted and the Job never reached a
      # `Complete` condition, leaving the backend's wait-for-migrate to time out
      # against a migration that had never really run. Deliberately the same gate
      # the backend and worker carry, rather than a third spelling of it.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c", "until nc -z {{ include "ai-platform.postgresHost" . }} {{ .Values.config.postgres.port }}; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}/backend:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
{{- end }}