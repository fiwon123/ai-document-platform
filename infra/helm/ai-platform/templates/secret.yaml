{{- if not .Values.secrets.external }}
# Dev placeholder secrets. The values below mirror docker-compose defaults and
# must NOT be used in production — set secrets.* in values.yaml, or set
# secrets.external=true and manage the Secret yourself (e.g. External
# Secrets/sealed-secrets) with the keys listed in NOTES.txt.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
type: Opaque
data:
  SECRET_KEY: {{ .Values.secrets.jwtSecretKey | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | b64enc | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | b64enc | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%s/%s" .Values.config.postgres.user .Values.secrets.postgresPassword (include "ai-platform.postgresHost" .) .Values.config.postgres.port .Values.config.postgres.db | b64enc | quote }}
{{- end }}