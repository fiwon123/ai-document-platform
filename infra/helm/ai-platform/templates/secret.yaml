# Placeholder dev secrets. Use --set secrets.existingSecret to point at a
# real Secret (e.g. created by External Secrets) instead. The values below
# mirror docker-compose defaults and must NOT be used in production.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
type: Opaque
data:
  SECRET_KEY: {{ "your-secret-key-change-in-production" | b64enc | quote }}
  POSTGRES_PASSWORD: {{ "mysecretpassword" | b64enc | quote }}
  MINIO_ACCESS_KEY: {{ "minioadmin" | b64enc | quote }}
  MINIO_SECRET_KEY: {{ "minioadmin" | b64enc | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%s/%s" .Values.config.postgres.user "mysecretpassword" (default (printf "%s-postgres" (include "ai-platform.fullname" .)) .Values.config.postgres.host) .Values.config.postgres.port .Values.config.postgres.db | b64enc | quote }}