apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-platform.fullname" . }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ai-platform.fullname" . }}-migrate-waiter
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  # Waiters also poll Deployment status during startup.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ai-platform.fullname" . }}-app-migrate-waiter
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ai-platform.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ai-platform.fullname" . }}-migrate-waiter