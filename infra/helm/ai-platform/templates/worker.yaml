apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-platform.fullname" . }}-worker
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.workerReplicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "ai-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "ai-platform.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c", "until nc -z {{ include "ai-platform.postgresHost" . }} {{ .Values.config.postgres.port }}; do echo waiting for postgres; sleep 2; done"]
        - name: wait-for-migrate
          # bitnami/kubectl no longer exists on Docker Hub (Bitnami removed its
          # free catalogue images), so this init container could not start at
          # all: `docker.io/bitnami/kubectl:1.30: not found` (#648). The
          # official Kubernetes image is used instead.
          image: registry.k8s.io/kubectl:v1.30.14
          securityContext:
            # This image is distroless and runs as uid 0, so `runAsNonRoot` on
            # its own is refused by the kubelet ("image will run as root"). The
            # uid is declared explicitly rather than inherited from the image.
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # `args` only, so the image entrypoint (/bin/kubectl) is kept. The
          # previous `sh -c 'until kubectl get job ... | grep -q 1'` loop cannot
          # work here: this image has no shell (`sh` resolves to a kubectl
          # subcommand and errors out). `kubectl wait` does the same job
          # natively, and being bounded it fails the pod visibly instead of
          # polling forever.
          args:
            - wait
            - --for=condition=complete
            - job/{{ include "ai-platform.fullname" . }}-migrate
            - -n
            - {{ .Release.Namespace }}
            - --timeout=300s
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}/worker:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["arq", "app.worker.WorkerSettings"]
          envFrom:
            - configMapRef:
                name: {{ include "ai-platform.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secrets.name }}
          {{- with .Values.worker.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}