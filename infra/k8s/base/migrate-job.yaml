# One-shot Alembic migration Job. The backend and worker Deployments gate
# their startup on this Job completing (see their wait-for-migrate
# initContainers). A fresh `kubectl apply` registers the Job once; re-applies
# after it has completed are no-ops (status.succeeded stays 1).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-platform
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: app
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ai-platform/backend:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi