# One-shot Alembic migration Job. The backend and worker Deployments gate
# their startup on this Job completing (see their wait-for-migrate
# initContainers). A fresh `kubectl apply` registers the Job once; re-applies
# after it has completed are no-ops (status.succeeded stays 1).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-platform
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: app
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # The one workload that must reach Postgres, and previously the only one
      # with no gate on it: `alembic upgrade head` connects on first instruction,
      # so a fresh `kubectl apply` raced the Postgres StatefulSet through its
      # image pull and PVC init. `backoffLimit: 3` was then exhausted, the pod
      # was deleted, and the Job never reached a `Complete` condition — leaving
      # the backend's wait-for-migrate to time out against a migration that had
      # never really run. Deliberately the same gate the backend and worker
      # Deployments already carry, rather than a third spelling of it.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534 # nobody
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - >
              until nc -z postgres 5432; do
                echo "waiting for postgres...";
                sleep 2;
              done
      containers:
        - name: migrate
          image: ai-platform/backend:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi