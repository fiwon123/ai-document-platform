# ServiceAccount used by app workloads, with a narrow Role allowing pods to
# observe the migrate Job status (used by backend/worker initContainers to
# start only after migrations complete).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: migrate-waiter
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-platform
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  # Cheap liveness checks against the app's own namespace for initContainers.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-migrate-waiter
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-platform
subjects:
  - kind: ServiceAccount
    name: app
    namespace: ai-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: migrate-waiter