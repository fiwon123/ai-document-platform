# Background worker: arq consuming the job queue from Redis.
# Same image as backend, different command (arq WorkerSettings).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-platform
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: ai-platform/worker:latest
          imagePullPolicy: IfNotPresent
          command: ["arq", "app.worker.WorkerSettings"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi