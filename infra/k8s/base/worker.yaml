# Background worker: arq consuming the job queue from Redis.
# Same image as backend, different command (arq WorkerSettings).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: ai-platform
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: app
      # Worker image runs as non-root 'app' user; enforce it at the pod level.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # The worker needs the schema in place before consuming jobs.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534 # nobody
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - >
              until nc -z postgres 5432; do
                echo "waiting for postgres...";
                sleep 2;
              done
        - name: wait-for-migrate
          # bitnami/kubectl no longer exists on Docker Hub (Bitnami removed its
          # free catalogue images), so this init container could not start at
          # all: `docker.io/bitnami/kubectl:1.30: not found` (#648). The
          # official Kubernetes image is used instead.
          image: registry.k8s.io/kubectl:v1.30.14
          securityContext:
            # This image is distroless and runs as uid 0, so `runAsNonRoot` on
            # its own is refused by the kubelet ("image will run as root"). The
            # uid is declared explicitly rather than inherited from the image.
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # `args` only, so the image entrypoint (/bin/kubectl) is kept. The
          # previous `sh -c 'until kubectl get job ... | grep -q 1'` loop cannot
          # work here: this image has no shell (`sh` resolves to a kubectl
          # subcommand and errors out). `kubectl wait` does the same job
          # natively, and being bounded it fails the pod visibly instead of
          # polling forever.
          args:
            - wait
            - --for=condition=complete
            - job/migrate
            - -n
            - ai-platform
            - --timeout=300s
      containers:
        - name: worker
          image: ai-platform/worker:latest
          imagePullPolicy: IfNotPresent
          command: ["arq", "app.worker.WorkerSettings"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi