# Ingress for production traffic. Frontend serves the SPA; /v1 is proxied
# by the frontend nginx to the backend Service — so a single Host rule works.
# Requires an Ingress controller (e.g. ingress-nginx, AWS ALB, GKE Ingress).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: ai-platform
  annotations:
    # Common defaults; override per cloud provider.
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ai-platform.example.com
      secretName: ai-platform-tls # TLS cert secret (create via cert-manager or cloud LB)
  rules:
    - host: ai-platform.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080