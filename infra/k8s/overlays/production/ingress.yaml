# Ingress for production traffic. Frontend serves the SPA; /v1 is proxied
# by the frontend nginx to the backend Service — so a single Host rule works.
# Requires an Ingress controller (e.g. ingress-nginx, AWS ALB, GKE Ingress)
# and cert-manager (cert-manager.yaml in this overlay).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: ai-platform
  annotations:
    # Common defaults; override per cloud provider.
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Issue + auto-renew the TLS certificate via cert-manager (see
    # cert-manager.yaml). For local testing switch to `selfsigned`.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ai-platform.example.com
      # cert-manager creates/renews this secret from the ClusterIssuer above.
      secretName: ai-platform-tls
  rules:
    - host: ai-platform.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080