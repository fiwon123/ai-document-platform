apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - hpa.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - pdb.yaml

# Apply the environment label to metadata only — do NOT touch selectors
# (they are immutable on existing workloads; adding labels there would make
# re-apply or overlay switches fail).
labels:
  - pairs:
      environment: production

# Production images: PLACEHOLDER registry. Override with your real registry
# before deploying, e.g.:
#   kustomize edit set image \
#     ai-platform/backend=ghcr.io/<owner>/ai-platform/backend:1.2.3
#   (and the same for worker/frontend)
images:
  - name: ai-platform/backend
    newName: ghcr.io/EXAMPLE/ai-platform/backend
    newTag: latest
  - name: ai-platform/worker
    newName: ghcr.io/EXAMPLE/ai-platform/worker
    newTag: latest
  - name: ai-platform/frontend
    newName: ghcr.io/EXAMPLE/ai-platform/frontend
    newTag: latest

patches:
  # Production replicas.
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  # Always re-pull the tagged image in production.
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always