# NetworkPolicy: default-deny ingress/egress for the ai-platform namespace,
# with explicit allows between app components.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ai-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow all namespace-internal traffic (app pods talking to
# postgres/redis/minio/backend) plus DNS resolution.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: ai-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-platform
        - podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-platform
        - podSelector: {}
    # DNS
    - to:
        - namespaceSelector: {} # any namespace — matches kube-system coredns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53