# PodDisruptionBudgets so voluntary disruptions (node drains, upgrades)
# never take down the whole app.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: ai-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: ai-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend