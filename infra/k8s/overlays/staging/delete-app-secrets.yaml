# Remove the dev placeholder Secret shipped in the base. The real `app-secrets`
# Secret is materialized by External Secrets Operator (see eso.yaml) — the
# plaintext base values, above all the published SECRET_KEY, must never reach a
# real cluster. Same reasoning as the production overlay, which deletes it for
# the same reason.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ai-platform
$patch: delete
