# Ingress for staging traffic (mirrors the production ingress, but uses the
# Let's Encrypt STAGING ClusterIssuer and a staging hostname — certificates
# are issued via the real ACME flow but are not publicly trusted).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: ai-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Issue + auto-renew via cert-manager (see cert-manager.yaml in this
    # overlay); switch to `selfsigned` for local testing.
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging.example.com
      secretName: ai-platform-tls-staging
  rules:
    - host: staging.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080